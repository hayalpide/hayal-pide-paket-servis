<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hayal Pide - Paket Servis</title>
<meta name="theme-color" content="#111111">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#101010;
    color:#fff;
    font-family:Arial,sans-serif;
}

button,input,textarea,select{font-family:inherit}

.hidden{display:none!important}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:12px;
}

.login-container{
    width:100%;
    max-width:430px;
    min-height:100vh;
    margin:auto;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:24px;
}

.logo{
    text-align:center;
    font-size:34px;
    font-weight:900;
}

.subtitle{
    text-align:center;
    color:#999;
    margin:8px 0 28px;
}

.card,.section,.topbar{
    background:#1b1b1b;
    border:1px solid #2d2d2d;
    border-radius:20px;
    padding:18px;
    margin-bottom:14px;
}

input,textarea,select{
    width:100%;
    background:#111;
    color:#fff;
    border:1px solid #333;
    border-radius:12px;
    padding:14px;
    font-size:16px;
    outline:none;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.field{margin-bottom:13px}

.field label{
    display:block;
    color:#bbb;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
}

.btn{
    width:100%;
    border:0;
    border-radius:12px;
    padding:15px;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
}

.orange{background:#ff7a00;color:#fff}
.dark{background:#333;color:#fff}
.green{background:#188744;color:#fff}
.red{background:#a92828;color:#fff}
.whatsapp{background:#168c48;color:#fff}

.message{
    text-align:center;
    color:#aaa;
    min-height:20px;
    margin-top:12px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.top-title{
    font-size:21px;
    font-weight:900;
}

.top-sub{
    color:#888;
    font-size:12px;
    margin-top:4px;
}

.logout{
    background:#333;
    color:#fff;
    border:0;
    border-radius:10px;
    padding:11px 14px;
    font-weight:bold;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:14px;
}

.stat{
    background:#1b1b1b;
    border:1px solid #2d2d2d;
    border-radius:16px;
    padding:14px;
}

.stat-title{
    color:#999;
    font-size:12px;
}

.stat-value{
    font-size:25px;
    font-weight:900;
    margin-top:7px;
}

.section-title{
    font-size:20px;
    font-weight:900;
    margin-bottom:15px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.full{grid-column:1/-1}

.order-list{
    display:grid;
    gap:12px;
}

.order-card{
    background:#111;
    border:1px solid #303030;
    border-radius:17px;
    padding:16px;
}

.order-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.order-no{
    font-weight:900;
    font-size:17px;
}

.time{
    color:#777;
    font-size:12px;
    margin-top:4px;
}

.status{
    border-radius:999px;
    padding:7px 10px;
    background:#555;
    font-size:11px;
    font-weight:900;
    white-space:nowrap;
}

.status.yolda{background:#a66b00}
.status.teslim_edildi{background:#19763e}
.status.iptal{background:#8b2929}

.customer{
    font-size:19px;
    font-weight:900;
    margin-top:14px;
}

.row{
    color:#bbb;
    margin-top:8px;
    line-height:1.45;
}

.total{
    font-size:21px;
    font-weight:900;
    margin-top:13px;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:14px;
}

.empty{
    text-align:center;
    color:#777;
    padding:35px 10px;
}

.courier-order{
    border:2px solid #333;
}

.courier-order.yolda{
    border-color:#a66b00;
}

.courier-order.bekliyor{
    border-color:#555;
}

.big-status{
    text-align:center;
    padding:12px;
    border-radius:12px;
    background:#333;
    font-weight:900;
    margin:12px 0;
}

.big-status.yolda{
    background:#8c5d00;
}

.big-status.teslim{
    background:#19763e;
}

.courier-actions{
    display:grid;
    gap:9px;
    margin-top:15px;
}

@media(max-width:650px){

    .container{padding:10px}

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{grid-column:auto}

    .stats{gap:7px}

    .stat{padding:11px}

    .stat-value{font-size:21px}

    .actions{
        grid-template-columns:1fr;
    }

    .top-title{font-size:18px}
}
</style>
</head>

<body>

<!-- GİRİŞ -->

<div id="loginScreen">

<div class="login-container">

<div class="logo">HAYAL PİDE</div>
<div class="subtitle">Paket Servis Yönetim Sistemi</div>

<div class="card">

<h2>Giriş Yap</h2>

<div class="field">
<label>E-posta</label>
<input id="email" type="email" placeholder="E-posta adresi">
</div>

<div class="field">
<label>Şifre</label>
<input id="password" type="password" placeholder="Şifre">
</div>

<button class="btn orange" id="loginBtn">GİRİŞ YAP</button>

<div class="message" id="loginMessage"></div>

</div>
</div>
</div>


<!-- ADMİN -->

<div id="adminScreen" class="hidden">

<div class="container">

<div class="topbar">

<div>
<div class="top-title">HAYAL PİDE</div>
<div class="top-sub">Paket Servis Yönetim Paneli</div>
</div>

<button class="logout" id="adminLogout">ÇIKIŞ</button>

</div>


<div class="stats">

<div class="stat">
<div class="stat-title">AKTİF SİPARİŞ</div>
<div class="stat-value" id="activeCount">0</div>
</div>

<div class="stat">
<div class="stat-title">YOLDA</div>
<div class="stat-value" id="roadCount">0</div>
</div>

<div class="stat">
<div class="stat-title">BUGÜN TESLİM</div>
<div class="stat-value" id="deliveredCount">0</div>
</div>

</div>


<div class="section">

<div class="section-title">➕ Yeni Sipariş</div>

<form id="orderForm">

<div class="form-grid">

<div class="field">
<label>Müşteri Adı *</label>
<input id="customerName" required placeholder="Örn: Ahmet Yılmaz">
</div>

<div class="field">
<label>Telefon *</label>
<input id="customerPhone" type="tel" required placeholder="05XX XXX XX XX">
</div>

<div class="field full">
<label>Adres *</label>
<textarea id="customerAddress" required placeholder="Mahalle, sokak, bina no, daire no..."></textarea>
</div>

<div class="field full">
<label>Sipariş *</label>
<textarea id="orderText" required placeholder="Örn: 2 Kuşbaşılı Pide, 1 Ayran"></textarea>
</div>

<div class="field">
<label>Tutar (TL) *</label>
<input id="orderAmount" type="number" min="0.01" step="0.01" required placeholder="450">
</div>

<div class="field">
<label>Ödeme</label>
<select id="paymentMethod">
<option value="nakit">Nakit</option>
<option value="kart">Kart</option>
<option value="online">Online</option>
</select>
</div>

<div class="field">
<label>Kurye</label>
<select id="courierSelect">
<option value="EkrRQkpLKXby9vDwlmap6EA6ZkD3">Kurye 1</option>
</select>
</div>

<div class="field">
<label>Sipariş Notu</label>
<input id="orderNote" placeholder="Örn: Zile basmayın">
</div>

<div class="field full">
<button class="btn orange" id="createBtn">SİPARİŞİ OLUŞTUR</button>
</div>

</div>
</form>

<div class="message" id="orderMessage"></div>

</div>


<div class="section">

<div class="section-title">📋 Siparişler</div>

<div id="adminOrders" class="order-list">
<div class="empty">Siparişler yükleniyor...</div>
</div>

</div>

</div>
</div>


<!-- KURYE -->

<div id="courierScreen" class="hidden">

<div class="container">

<div class="topbar">

<div>
<div class="top-title">HAYAL PİDE 🛵</div>
<div class="top-sub">Kurye Paneli</div>
</div>

<button class="logout" id="courierLogout">ÇIKIŞ</button>

</div>


<div class="section">

<div class="section-title">
🛵 Bana Atanan Siparişler
</div>

<div id="courierOrders" class="order-list">

<div class="empty">
Siparişler yükleniyor...
</div>

</div>

</div>

</div>
</div>


<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getDatabase,
ref,
push,
update,
onValue
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


const firebaseConfig={
apiKey:"AIzaSyBaAUdtandBzmWyNLkdnhsfXVpNDnOlS24",
authDomain:"hayal-pide-paket-servis.firebaseapp.com",
projectId:"hayal-pide-paket-servis",
storageBucket:"hayal-pide-paket-servis.firebasestorage.app",
messagingSenderId:"551700082149",
appId:"1:551700082149:web:6d7f5aea7f8c51ff55930c",
measurementId:"G-8PEXMYJN3L"
};


const app=initializeApp(firebaseConfig);
const auth=getAuth(app);

const db=getDatabase(
app,
"https://hayal-pide-paket-servis-default-rtdb.europe-west1.firebasedatabase.app"
);


const ADMIN_UID="Rmf7DZGAsLRuQ00JAJOwERvPIGC3";
const COURIER_UID="EkrRQkpLKXby9vDwlmap6EA6ZkD3";


const loginScreen=document.getElementById("loginScreen");
const adminScreen=document.getElementById("adminScreen");
const courierScreen=document.getElementById("courierScreen");


function login(){
loginScreen.classList.remove("hidden");
adminScreen.classList.add("hidden");
courierScreen.classList.add("hidden");
}

function admin(){
loginScreen.classList.add("hidden");
adminScreen.classList.remove("hidden");
courierScreen.classList.add("hidden");
}

function courier(){
loginScreen.classList.add("hidden");
adminScreen.classList.add("hidden");
courierScreen.classList.remove("hidden");
}


/* GİRİŞ */

document.getElementById("loginBtn").onclick=async()=>{

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
const msg=document.getElementById("loginMessage");

if(!email||!password){
msg.textContent="E-posta ve şifreyi girin.";
return;
}

const btn=document.getElementById("loginBtn");

btn.disabled=true;
btn.textContent="GİRİŞ YAPILIYOR...";
msg.textContent="";

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

}catch(error){

console.error(error);
msg.textContent="Giriş başarısız.";

btn.disabled=false;
btn.textContent="GİRİŞ YAP";

}

};


/* OTURUM */

onAuthStateChanged(auth,user=>{

if(!user){
login();
return;
}

if(user.uid===ADMIN_UID){

admin();
loadAdminOrders();
return;

}

if(user.uid===COURIER_UID){

courier();
loadCourierOrders();
return;

}

signOut(auth);

login();

document.getElementById("loginMessage").textContent=
"Bu hesabın erişim yetkisi yok.";

});


/* ADMİN SİPARİŞ OLUŞTUR */

document.getElementById("orderForm").onsubmit=async e=>{

e.preventDefault();

const btn=document.getElementById("createBtn");
const msg=document.getElementById("orderMessage");

const courierId=document.getElementById("courierSelect").value;

const orderRef=push(ref(db,"orders"));
const orderId=orderRef.key;

const now=Date.now();

const order={

orderId,

customerName:document.getElementById("customerName").value.trim(),

customerPhone:document.getElementById("customerPhone").value.trim(),

customerAddress:document.getElementById("customerAddress").value.trim(),

orderText:document.getElementById("orderText").value.trim(),

amount:Number(document.getElementById("orderAmount").value),

paymentMethod:document.getElementById("paymentMethod").value,

orderNote:document.getElementById("orderNote").value.trim(),

courierId,

courierName:"Kurye 1",

status:"kurye_bekliyor",

createdAt:now,

pickedUpAt:null,

deliveredAt:null

};


if(
!order.customerName||
!order.customerPhone||
!order.customerAddress||
!order.orderText||
!order.amount
){

msg.textContent="Zorunlu alanları doldurun.";
return;

}


btn.disabled=true;
btn.textContent="OLUŞTURULUYOR...";
msg.textContent="";


try{

const updates={};

updates["/orders/"+orderId]=order;

updates[
"/courierOrders/"+courierId+"/"+orderId
]=order;

await update(ref(db),updates);

msg.textContent="✅ Sipariş oluşturuldu.";

document.getElementById("orderForm").reset();

setTimeout(()=>{
msg.textContent="";
},2500);

}catch(error){

console.error(error);

msg.textContent="❌ Sipariş oluşturulamadı.";

}finally{

btn.disabled=false;
btn.textContent="SİPARİŞİ OLUŞTUR";

}

};


/* ADMİN CANLI SİPARİŞLER */

function loadAdminOrders(){

onValue(ref(db,"orders"),snapshot=>{

const data=snapshot.val();
const list=document.getElementById("adminOrders");

if(!data){

list.innerHTML=
'<div class="empty">Henüz sipariş yok.</div>';

updateStats([]);
return;

}

const orders=Object.entries(data)
.map(([id,o])=>({id,...o}))
.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

list.innerHTML=orders.map(adminCard).join("");

updateStats(orders);

});

}


/* ADMİN KARTI */

function adminCard(o){

const statusText={
hazirlaniyor:"Hazırlanıyor",
kurye_bekliyor:"Kurye Bekliyor",
yolda:"Yolda",
teslim_edildi:"Teslim Edildi",
iptal:"İptal"
}[o.status]||o.status;

const date=o.createdAt
?new Date(o.createdAt).toLocaleString("tr-TR",{
day:"2-digit",
month:"2-digit",
hour:"2-digit",
minute:"2-digit"
})
:"-";

return `

<div class="order-card">

<div class="order-head">

<div>
<div class="order-no">
Sipariş #${escapeHtml(o.id.slice(-6))}
</div>

<div class="time">${date}</div>
</div>

<div class="status ${o.status}">
${statusText}
</div>

</div>

<div class="customer">
${escapeHtml(o.customerName)}
</div>

<div class="row">
📞 ${escapeHtml(o.customerPhone)}
</div>

<div class="row">
📍 ${escapeHtml(o.customerAddress)}
</div>

<div class="row">
🥙 ${escapeHtml(o.orderText).replace(/\n/g,"<br>")}
</div>

<div class="row">
💳 ${paymentName(o.paymentMethod)}
&nbsp; • &nbsp;
🛵 ${escapeHtml(o.courierName||"Kurye 1")}
</div>

${o.orderNote?
`<div class="row">📝 ${escapeHtml(o.orderNote)}</div>`:""}

<div class="total">
${Number(o.amount||0).toLocaleString("tr-TR",{minimumFractionDigits:2})} TL
</div>

<div class="actions">

<button class="btn dark"
onclick="openMap('${encodeURIComponent(o.customerAddress||"")}')">
📍 HARİTADA AÇ
</button>

<button class="btn dark"
onclick="callCustomer('${encodeURIComponent(o.customerPhone||"")}')">
📞 ARA
</button>

</div>

${o.status!=="teslim_edildi"&&o.status!=="iptal"
?`
<div style="margin-top:8px">
<button class="btn red"
onclick="cancelOrder('${o.id}','${o.courierId}')">
İPTAL ET
</button>
</div>
`:""}

</div>
`;

}


/* KURYE SİPARİŞLERİ */

function loadCourierOrders(){

const path="courierOrders/"+COURIER_UID;

onValue(ref(db,path),snapshot=>{

const data=snapshot.val();

const list=document.getElementById("courierOrders");

if(!data){

list.innerHTML=
'<div class="empty">Şu anda atanmış sipariş yok.</div>';

return;

}

const orders=Object.entries(data)
.map(([id,o])=>({id,...o}))
.filter(o=>o.status!=="teslim_edildi"&&o.status!=="iptal")
.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

if(!orders.length){

list.innerHTML=
'<div class="empty">Şu anda teslim edilecek sipariş yok. 🎉</div>';

return;

}

list.innerHTML=orders.map(courierCard).join("");

});

}


/* KURYE KARTI */

function courierCard(o){

const yolda=o.status==="yolda";

return `

<div class="order-card courier-order ${yolda?"yolda":"bekliyor"}">

<div class="order-head">

<div>

<div class="order-no">
Sipariş #${escapeHtml(o.id.slice(-6))}
</div>

<div class="time">
${o.createdAt?
new Date(o.createdAt).toLocaleString("tr-TR",{
day:"2-digit",
month:"2-digit",
hour:"2-digit",
minute:"2-digit"
}):"-"}
</div>

</div>

<div class="status ${o.status}">
${yolda?"YOLDA":"KURYE BEKLİYOR"}
</div>

</div>


<div class="customer">
👤 ${escapeHtml(o.customerName)}
</div>

<div class="row">
📞 ${escapeHtml(o.customerPhone)}
</div>

<div class="row">
📍 ${escapeHtml(o.customerAddress)}
</div>

<div class="row">
🥙 ${escapeHtml(o.orderText).replace(/\n/g,"<br>")}
</div>

<div class="row">
💳 ${paymentName(o.paymentMethod)}
</div>

${o.orderNote?
`<div class="row">📝 ${escapeHtml(o.orderNote)}</div>`:""}

<div class="total">
${Number(o.amount||0).toLocaleString("tr-TR",{minimumFractionDigits:2})} TL
</div>


<div class="courier-actions">

<button class="btn dark"
onclick="openMap('${encodeURIComponent(o.customerAddress||"")}')">
📍 HARİTADA AÇ
</button>

<button class="btn dark"
onclick="callCustomer('${encodeURIComponent(o.customerPhone||"")}')">
📞 MÜŞTERİYİ ARA
</button>

<button class="btn whatsapp"
onclick="openWhatsApp('${encodeURIComponent(o.customerPhone||"")}')">
💬 WHATSAPP
</button>


${
!yolda
?
`
<button class="btn orange"
onclick="pickupOrder('${o.id}')">
🛵 TESLİM ALDIM / YOLA ÇIKTIM
</button>
`
:
`
<div class="big-status yolda">
🛵 SİPARİŞ YOLDA
</div>

<button class="btn green"
onclick="deliverOrder('${o.id}')">
✅ TESLİM ETTİM
</button>
`
}

</div>

</div>

`;

}


/* KURYE YOLA ÇIKTI */

window.pickupOrder=async function(orderId){

try{

const now=Date.now();

const updates={};

updates[
"/orders/"+orderId+"/status"
]="yolda";

updates[
"/orders/"+orderId+"/pickedUpAt"
]=now;

updates[
"/courierOrders/"+COURIER_UID+"/"+orderId+"/status"
]="yolda";

updates[
"/courierOrders/"+COURIER_UID+"/"+orderId+"/pickedUpAt"
]=now;

await update(ref(db),updates);

}catch(error){

console.error(error);

alert("Sipariş durumu güncellenemedi.");

}

};


/* KURYE TESLİM ETTİ */

window.deliverOrder=async function(orderId){

if(!confirm("Sipariş teslim edildi olarak işaretlensin mi?")){
return;
}

try{

const now=Date.now();

const updates={};

updates[
"/orders/"+orderId+"/status"
]="teslim_edildi";

updates[
"/orders/"+orderId+"/deliveredAt"
]=now;

updates[
"/courierOrders/"+COURIER_UID+"/"+orderId+"/status"
]="teslim_edildi";

updates[
"/courierOrders/"+COURIER_UID+"/"+orderId+"/deliveredAt"
]=now;

await update(ref(db),updates);

}catch(error){

console.error(error);

alert("Teslim durumu güncellenemedi.");

}

};


/* İPTAL */

window.cancelOrder=async function(orderId,courierId){

if(!confirm("Bu sipariş iptal edilsin mi?")){
return;
}

try{

const updates={};

updates[
"/orders/"+orderId+"/status"
]="iptal";

updates[
"/courierOrders/"+courierId+"/"+orderId+"/status"
]="iptal";

await update(ref(db),updates);

}catch(error){

console.error(error);

alert("Sipariş iptal edilemedi.");

}

};


/* HARİTA */

window.openMap=function(address){

const decoded=decodeURIComponent(address);

if(!decoded)return;

window.open(
"https://www.google.com/maps/search/?api=1&query="+
encodeURIComponent(decoded),
"_blank"
);

};


/* TELEFON */

window.callCustomer=function(phone){

const decoded=decodeURIComponent(phone);

if(decoded){
window.location.href="tel:"+decoded;
}

};


/* WHATSAPP */

window.openWhatsApp=function(phone){

let decoded=decodeURIComponent(phone)
.replace(/\D/g,"");

if(decoded.startsWith("0")){
decoded="90"+decoded.substring(1);
}

if(decoded.length<10){
alert("Geçerli telefon numarası yok.");
return;
}

window.open(
"https://wa.me/"+decoded,
"_blank"
);

};


/* İSTATİSTİK */

function updateStats(orders){

const active=orders.filter(
o=>o.status!=="teslim_edildi"&&o.status!=="iptal"
).length;

const road=orders.filter(
o=>o.status==="yolda"
).length;

const start=new Date();

start.setHours(0,0,0,0);

const delivered=orders.filter(
o=>o.status==="teslim_edildi" &&
(o.deliveredAt||0)>=start.getTime()
).length;

document.getElementById("activeCount").textContent=active;
document.getElementById("roadCount").textContent=road;
document.getElementById("deliveredCount").textContent=delivered;

}


/* ÖDEME */

function paymentName(value){

return {
nakit:"Nakit",
kart:"Kart",
online:"Online"
}[value]||value||"-";

}


/* HTML GÜVENLİĞİ */

function escapeHtml(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ÇIKIŞ */

document.getElementById("adminLogout").onclick=()=>{
signOut(auth);
};

document.getElementById("courierLogout").onclick=()=>{
signOut(auth);
};
