<script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import {
        getAuth,
        signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    // Firebase proje bilgileri
    const firebaseConfig = {
        apiKey: "AIzaSyBaAUdtandBzmWyNLkdnhsfXVpNDnOlS24",
        authDomain: "hayal-pide-paket-servis.firebaseapp.com",
        projectId: "hayal-pide-paket-servis",
        storageBucket: "hayal-pide-paket-servis.firebasestorage.app",
        messagingSenderId: "551700082149",
        appId: "1:551700082149:web:6d7f5aea7f8c51ff55930c",
        measurementId: "G-8PEXMYJN3L"
    };

    // Firebase'i başlat
    const app = initializeApp(firebaseConfig);

    // Authentication
    const auth = getAuth(app);

    const loginBtn = document.getElementById("loginBtn");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const message = document.getElementById("message");

    loginBtn.addEventListener("click", async () => {

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
            message.textContent = "E-posta ve şifreyi girin.";
            return;
        }

        loginBtn.disabled = true;
        loginBtn.textContent = "GİRİŞ YAPILIYOR...";
        message.textContent = "";

        try {

            const userCredential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

            const user = userCredential.user;

            message.textContent =
                "Giriş başarılı. Kullanıcı: " + user.email;

            console.log("Firebase UID:", user.uid);

        } catch (error) {

            console.error(error);

            message.textContent =
                "Giriş başarısız. E-posta veya şifreyi kontrol edin.";

        } finally {

            loginBtn.disabled = false;
            loginBtn.textContent = "GİRİŞ YAP";

        }

    });

</script>
