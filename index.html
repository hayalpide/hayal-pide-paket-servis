<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ea580c">
    <title>Hayal Pide | Profesyonel POS</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#fff7ed', 100: '#ffedd5', 500: '#ea580c', 600: '#c2410c' },
                        surface: '#f8fafc'
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(15, 23, 42, 0.05), 0 2px 6px -1px rgba(15, 23, 42, 0.02)',
                        'card': '0 2px 8px -2px rgba(0, 0, 0, 0.05)'
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Custom Overrides & Print Styles */
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; -webkit-tap-highlight-color: transparent; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Smooth transitions */
        .btn-active-scale:active { transform: scale(0.97); }
        .glass-header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); }

        /* Print CSS for Thermal Printer */
        @media print {
            @page { size: 80mm auto; margin: 0mm !important; }
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 78mm; padding: 2mm; font-family: 'Courier New', Courier, monospace; font-size: 12px; color: #000; background: #fff; }
            .no-print { display: none !important; }
            .print-row { display: flex; justify-content: space-between; margin-bottom: 2px; }
            .print-line { border-top: 1px dashed #000; margin: 4px 0; }
        }

        /* Safe area for mobile notch */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    </style>
</head>
<body class="overflow-hidden w-full h-screen flex flex-col">

    <div id="loginScreen" class="absolute inset-0 z-50 flex items-center justify-center p-4 bg-gradient-to-br from-brand-100 to-slate-100 transition-opacity duration-300">
        <div class="bg-white rounded-3xl p-8 w-full max-w-sm shadow-2xl border border-slate-100 flex flex-col items-center text-center">
            <div class="w-20 h-20 bg-brand-50 rounded-2xl flex items-center justify-center mb-4 text-4xl shadow-inner">🍕</div>
            <h1 class="text-2xl font-black tracking-tight text-slate-800 mb-1">HAYAL <span class="text-brand-500">PİDE</span></h1>
            <p class="text-slate-500 text-sm mb-8 font-medium">Sisteme giriş yapmak için rolünüzü seçin</p>
            
            <button onclick="loginAs('admin')" class="w-full btn-active-scale bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 px-6 rounded-xl mb-3 transition-colors flex items-center justify-center gap-2">
                <span>👨‍💻</span> Yönetici (Sipariş Ekranı)
            </button>
            <button onclick="loginAs('courier')" class="w-full btn-active-scale bg-brand-500 hover:bg-brand-600 text-white font-bold py-4 px-6 rounded-xl transition-colors flex items-center justify-center gap-2">
                <span>🛵</span> Kurye (Mobil Ekran)
            </button>
        </div>
    </div>

    <div id="appContainer" class="hidden flex-col h-full w-full">
        <!-- Header -->
        <header class="glass-header h-14 shrink-0 border-b border-slate-200 px-4 flex items-center justify-between z-40 shadow-sm">
            <div class="font-black text-xl tracking-tight text-slate-800">HAYAL <span class="text-brand-500">PİDE</span></div>
            <div class="flex items-center gap-3">
                <button id="soundBtn" onclick="toggleSound()" class="hidden md:flex text-sm font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg transition-colors">🔔 Ses</button>
                <div id="userBadge" class="bg-brand-50 border border-brand-100 text-brand-600 font-bold px-3 py-1 rounded-full text-xs">Yönetici</div>
                <button onclick="logout()" class="text-sm font-semibold text-slate-500 hover:text-red-500 transition-colors ml-2">Çıkış</button>
            </div>
        </header>

        <!-- Main Content Area with Sidebar/Bottom Nav -->
        <div class="flex flex-1 overflow-hidden relative">
            
            <!-- Desktop Sidebar -->
            <aside class="hidden md:flex flex-col w-64 bg-white border-r border-slate-200 p-4 gap-2 overflow-y-auto shrink-0 z-30">
                <nav id="desktopNav" class="flex flex-col gap-1 w-full"></nav>
            </aside>

            <!-- Workspace -->
            <main id="workspace" class="flex-1 h-full overflow-y-auto bg-slate-50 pb-20 md:pb-0 relative scroll-smooth"></main>

            <!-- Mobile Bottom Nav -->
            <nav id="mobileNav" class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around items-center p-2 pb-safe z-40 shadow-[0_-4px_20px_rgba(0,0,0,0.05)]"></nav>
        </div>
    </div>

    <template id="tpl-nav-item">
        <button class="nav-btn w-full flex flex-col md:flex-row items-center justify-center md:justify-start gap-1 md:gap-3 p-2 md:px-4 md:py-3 rounded-xl md:rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition-all font-semibold text-[10px] md:text-sm btn-active-scale relative" data-view="{id}">
            <span class="text-xl md:text-lg">{icon}</span>
            <span class="truncate">{label}</span>
            <span class="badge hidden absolute top-1 right-2 md:relative md:top-auto md:right-auto bg-red-500 text-white text-[9px] md:text-xs font-black px-1.5 py-0.5 rounded-full md:ml-auto">0</span>
        </button>
    </template>

    <template id="view-new-order">
        <div class="p-4 md:p-6 h-full flex flex-col md:flex-row gap-6 max-w-7xl mx-auto">
            <!-- Left Panel: Customer & Cart (Sticky on Desktop) -->
            <div class="w-full md:w-[380px] flex flex-col gap-4 shrink-0 md:h-[calc(100vh-100px)] md:sticky md:top-6">
                <!-- Customer Card -->
                <div class="bg-white rounded-2xl p-5 shadow-card border border-slate-200">
                    <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2"><span class="text-brand-500">👤</span> Müşteri Bilgileri</h3>
                    <div class="flex flex-col gap-3 relative">
                        <div>
                            <input type="tel" id="newPhone" placeholder="Telefon (05xx...)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-medium focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition-all">
                            <div id="phoneSuggestions" class="hidden absolute top-12 left-0 right-0 bg-white border border-slate-200 shadow-xl rounded-xl z-50 max-h-40 overflow-y-auto"></div>
                        </div>
                        <input type="text" id="newName" placeholder="Ad Soyad" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-medium focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition-all">
                        <textarea id="newAddress" rows="2" placeholder="Açık Adres" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-medium focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition-all resize-none"></textarea>
                    </div>
                </div>

                <!-- Cart Card -->
                <div class="bg-white rounded-2xl p-5 shadow-card border border-slate-200 flex flex-col flex-1 min-h-[300px]">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-bold text-slate-800 flex items-center gap-2"><span class="text-brand-500">🛒</span> Sepet</h3>
                        <button onclick="clearCart()" class="text-xs font-bold text-slate-400 hover:text-red-500 transition-colors">Temizle</button>
                    </div>
                    
                    <div id="cartItems" class="flex-1 overflow-y-auto pr-2 flex flex-col gap-3 min-h-[100px] hide-scrollbar border-b border-slate-100 mb-4 pb-2">
                        <!-- Cart items go here -->
                        <div class="text-center text-slate-400 text-sm py-8 font-medium">Sepetiniz boş</div>
                    </div>

                    <div class="flex flex-col gap-3 mt-auto pt-2">
                        <input type="text" id="newNote" placeholder="Sipariş Notu..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-brand-500 transition-all">
                        
                        <div class="flex gap-2">
                            <select id="newPayment" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm font-medium focus:outline-none focus:border-brand-500 cursor-pointer">
                                <option value="Nakit">💵 Nakit</option>
                                <option value="Kredi Kartı">💳 Kredi Kartı</option>
                            </select>
                            <select id="newCourier" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm font-medium focus:outline-none focus:border-brand-500 cursor-pointer">
                                <option value="kurye1">Kurye 1</option>
                            </select>
                        </div>

                        <div class="flex items-center justify-between py-2 border-t border-slate-100 mt-1">
                            <span class="font-bold text-slate-500">Toplam</span>
                            <span id="cartTotal" class="text-2xl font-black text-brand-600">₺0</span>
                        </div>
                        <button onclick="createOrder()" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-bold py-3.5 rounded-xl transition-all btn-active-scale shadow-lg shadow-brand-500/30 flex items-center justify-center gap-2">
                            ✓ Siparişi Onayla
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Menu Grid -->
            <div class="flex-1 flex flex-col gap-4 min-w-0">
                <div class="bg-white rounded-2xl p-2 shadow-card border border-slate-200 sticky top-0 md:top-6 z-20">
                    <div id="catScroller" class="flex overflow-x-auto gap-2 p-2 hide-scrollbar snap-x">
                        <!-- Categories -->
                    </div>
                </div>

                <div id="menuGrid" class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 md:gap-4 pb-4">
                    <!-- Products -->
                </div>
            </div>
        </div>
    </template>

    <template id="view-active">
        <div class="p-4 md:p-6 max-w-7xl mx-auto">
            <div class="mb-6 hidden md:block">
                <h2 class="text-2xl font-black text-slate-800">Aktif Siparişler</h2>
                <p class="text-slate-500 font-medium">Hazırlanan ve yolda olan siparişleri takip edin.</p>
            </div>
            <div id="activeGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                <!-- Orders inject here -->
            </div>
        </div>
    </template>

    <template id="tpl-order-card">
        <div class="bg-white rounded-2xl p-4 shadow-card border border-slate-200 flex flex-col gap-3 relative overflow-hidden transition-all hover:shadow-md">
            <div class="absolute top-0 left-0 w-1.5 h-full {statusColor}"></div>
            <div class="flex justify-between items-start pl-2">
                <div>
                    <div class="font-bold text-slate-800 text-lg leading-tight">{name}</div>
                    <div class="text-xs font-bold text-slate-400 mt-0.5">{time}</div>
                </div>
                <div class="text-right">
                    <div class="font-black text-brand-600 text-lg">{total}</div>
                    <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">{payment}</div>
                </div>
            </div>
            <div class="pl-2 flex gap-2 mb-1">
                <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-wide {statusBg} {statusText} border {statusBorder}">
                    {statusLabel}
                </span>
            </div>
            <div class="pl-2 text-sm text-slate-600 leading-relaxed bg-slate-50 p-2 rounded-lg border border-slate-100">
                <div class="font-semibold text-slate-800 mb-1 line-clamp-3">{items}</div>
                {noteHtml}
            </div>
            <div class="pl-2 mt-auto pt-2 grid grid-cols-2 gap-2">
                <a href="tel:{phoneRaw}" class="btn-active-scale bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2.5 rounded-xl text-xs flex justify-center items-center gap-1 transition-colors">
                    📞 Ara
                </a>
                <a href="https://maps.google.com/?q={addressEnc}" target="_blank" class="btn-active-scale bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2.5 rounded-xl text-xs flex justify-center items-center gap-1 transition-colors">
                    📍 Harita
                </a>
                {actionBtn}
            </div>
        </div>
    </template>

    <template id="view-simple-list">
        <div class="p-4 md:p-6 max-w-5xl mx-auto">
            <div class="mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h2 id="listTitle" class="text-2xl font-black text-slate-800">Başlık</h2>
                    <p id="listSub" class="text-slate-500 font-medium">Açıklama</p>
                </div>
                <div id="listActions"></div>
            </div>
            <div class="bg-white rounded-2xl p-4 shadow-card border border-slate-200 mb-6">
                <input type="text" id="listSearch" placeholder="Ara..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-medium focus:outline-none focus:border-brand-500 transition-all">
            </div>
            <div id="listGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>
    </template>

    <!-- Modal System -->
    <div id="modalOverlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-200">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden transform scale-95 transition-transform duration-200" id="modalCard">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h3 id="modalTitle" class="font-bold text-lg text-slate-800">Başlık</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 text-xl font-bold leading-none p-1">&times;</button>
            </div>
            <div id="modalBody" class="p-6"></div>
        </div>
    </div>

    <!-- Print Area -->
    <div id="print-area"></div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-24 md:bottom-10 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-full font-bold text-sm shadow-2xl z-[999] transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none whitespace-nowrap"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, addDoc, updateDoc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Environment variables for standard sandbox compliance
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'hayal-pide-demo';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            // Dummy config for fallback if not injected
            projectId: "demo-project" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Core App State
        window.appState = {
            role: null, // 'admin' | 'courier'
            userId: null,
            menu: {},
            orders: [],
            customers: {},
            cart: [],
            selectedCategory: 'Tümü',
            unsubscribeOrders: null,
            soundEnabled: false
        };

        // UI Helpers
        window.$ = id => document.getElementById(id);
        window.money = n => "₺" + Number(n || 0).toLocaleString("tr-TR");
        window.norm = v => String(v || "").replace(/\D/g, "");

        window.toast = (msg) => {
            const el = $("toast");
            el.textContent = msg;
            el.classList.remove("translate-y-20", "opacity-0");
            setTimeout(() => el.classList.add("translate-y-20", "opacity-0"), 3000);
        };

        window.toggleSound = () => {
            window.appState.soundEnabled = !window.appState.soundEnabled;
            $("soundBtn").textContent = window.appState.soundEnabled ? "🔔 Ses" : "🔕 Ses";
            if(window.appState.soundEnabled) playBeep();
        };

        function playBeep() {
            if (!window.appState.soundEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch (e) {}
        }

        // --- STREAMING_CHUNK:Auth & View Management ---
        window.loginAs = async (role) => {
            try {
                const userCred = await signInAnonymously(auth);
                window.appState.userId = userCred.user.uid;
                window.appState.role = role;
                
                $("loginScreen").classList.add("opacity-0", "pointer-events-none");
                setTimeout(() => $("loginScreen").classList.add("hidden"), 300);
                
                $("appContainer").classList.remove("hidden");
                $("appContainer").classList.add("flex");
                $("userBadge").textContent = role === 'admin' ? "Yönetici" : "Kurye";
                
                buildNavigation();
                loadInitialData();
            } catch (err) {
                console.error("Auth error:", err);
                toast("Giriş yapılamadı!");
            }
        };

        window.logout = () => {
            window.appState.role = null;
            if(window.appState.unsubscribeOrders) window.appState.unsubscribeOrders();
            $("appContainer").classList.add("hidden");
            $("appContainer").classList.remove("flex");
            $("loginScreen").classList.remove("hidden");
            setTimeout(() => $("loginScreen").classList.remove("opacity-0", "pointer-events-none"), 10);
        };

        const pages = [
            { id: 'new', icon: '📝', label: 'Yeni Sipariş', roles: ['admin'] },
            { id: 'active', icon: '🛵', label: 'Aktif', roles: ['admin', 'courier'] },
            { id: 'history', icon: '🧾', label: 'Geçmiş', roles: ['admin'] },
            { id: 'customers', icon: '👥', label: 'Müşteriler', roles: ['admin'] }
        ];

        function buildNavigation() {
            const role = window.appState.role;
            const allowedPages = pages.filter(p => p.roles.includes(role));
            const template = $("tpl-nav-item").innerHTML;
            
            const html = allowedPages.map(p => {
                return template.replace(/{id}/g, p.id).replace('{icon}', p.icon).replace('{label}', p.label);
            }).join('');

            $("desktopNav").innerHTML = html;
            $("mobileNav").innerHTML = html;

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', () => switchView(btn.dataset.view));
            });

            // Default view
            switchView(role === 'admin' ? 'new' : 'active');
        }

        function switchView(viewId) {
            document.querySelectorAll('.nav-btn').forEach(b => {
                b.classList.remove('bg-brand-50', 'text-brand-600', 'shadow-sm');
                if(b.dataset.view === viewId) b.classList.add('bg-brand-50', 'text-brand-600', 'shadow-sm');
            });

            const ws = $("workspace");
            ws.innerHTML = '';
            
            if (viewId === 'new') {
                ws.appendChild($("view-new-order").content.cloneNode(true));
                renderMenu();
                renderCart();
                setupCustomerSearch();
            } else if (viewId === 'active') {
                ws.appendChild($("view-active").content.cloneNode(true));
                renderActiveOrders();
            } else if (viewId === 'history') {
                ws.appendChild($("view-simple-list").content.cloneNode(true));
                $("listTitle").textContent = "Sipariş Geçmişi";
                $("listSub").textContent = "Tüm siparişlerin listesi";
                renderSimpleList('history');
            } else if (viewId === 'customers') {
                ws.appendChild($("view-simple-list").content.cloneNode(true));
                $("listTitle").textContent = "Müşteri Rehberi";
                $("listSub").textContent = "Kayıtlı müşteri adresleri";
                renderSimpleList('customers');
            }
        }

        // --- STREAMING_CHUNK:Data Fetching (Firestore) ---
        const getColRef = (colName) => collection(db, 'artifacts', appId, 'public', 'data', colName);
        const getDocRef = (colName, docId) => doc(db, 'artifacts', appId, 'public', 'data', colName, docId);

        async function loadInitialData() {
            // Load Menu
            const menuRef = getDocRef('menu', 'default');
            onSnapshot(menuRef, (snap) => {
                if (snap.exists()) {
                    window.appState.menu = snap.data().categories || {};
                } else {
                    // Seed default data if empty
                    const defaultMenu = {
                        "Trabzon Yağlıları": [{name: "Trabzon Yağlısı Kavurmalı", price: 400}, {name: "Kaşarlı Yağlı", price: 350}],
                        "Pideler": [{name: "Kıymalı Pide", price: 260}, {name: "Kuşbaşılı Pide", price: 320}],
                        "İçecekler": [{name: "Ayran", price: 65}, {name: "Kola", price: 100}]
                    };
                    setDoc(menuRef, { categories: defaultMenu });
                    window.appState.menu = defaultMenu;
                }
                if($("catScroller")) renderMenu();
            }, (err) => console.error("Menu err:", err));

            // Load Orders (Realtime)
            const ordersRef = getColRef('orders');
            window.appState.unsubscribeOrders = onSnapshot(ordersRef, (snap) => {
                const newOrders = [];
                snap.forEach(doc => newOrders.push({ id: doc.id, ...doc.data() }));
                
                // Check for new incoming orders to play sound
                const prevActive = window.appState.orders.filter(o => o.status === 'kurye_bekliyor').length;
                const currActive = newOrders.filter(o => o.status === 'kurye_bekliyor').length;
                if(currActive > prevActive && window.appState.role === 'courier') {
                    playBeep();
                    toast("🛵 Yeni Sipariş Var!");
                }

                window.appState.orders = newOrders.sort((a,b) => b.createdAt - a.createdAt);
                updateBadges();
                
                if($("activeGrid")) renderActiveOrders();
                if($("listGrid") && $("listTitle").textContent.includes("Geçmiş")) renderSimpleList('history');
            });

            // Load Customers
            onSnapshot(getColRef('customers'), (snap) => {
                const custs = {};
                snap.forEach(doc => custs[doc.id] = doc.data());
                window.appState.customers = custs;
                if($("listGrid") && $("listTitle").textContent.includes("Müşteri")) renderSimpleList('customers');
            });
        }

        function updateBadges() {
            const activeCount = window.appState.orders.filter(o => o.status === 'kurye_bekliyor' || o.status === 'yolda').length;
            document.querySelectorAll('.badge').forEach(b => {
                if(activeCount > 0) {
                    b.textContent = activeCount;
                    b.classList.remove('hidden');
                } else {
                    b.classList.add('hidden');
                }
            });
        }

        // --- STREAMING_CHUNK:New Order Screen Logic ---
        function renderMenu() {
            const catScroller = $("catScroller");
            const grid = $("menuGrid");
            if(!catScroller || !grid) return;

            const menu = window.appState.menu;
            const cats = ['Tümü', ...Object.keys(menu)];
            
            // Categories
            catScroller.innerHTML = cats.map(c => `
                <button onclick="selectCategory('${c}')" class="snap-start shrink-0 px-4 py-2 rounded-xl text-sm font-bold transition-all ${c === window.appState.selectedCategory ? 'bg-slate-800 text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                    ${c}
                </button>
            `).join('');

            // Products
            let itemsToRender = [];
            if (window.appState.selectedCategory === 'Tümü') {
                Object.values(menu).forEach(arr => itemsToRender.push(...arr));
            } else {
                itemsToRender = menu[window.appState.selectedCategory] || [];
            }

            grid.innerHTML = itemsToRender.map(p => {
                const inCart = window.appState.cart.find(x => x.name === p.name);
                const badge = inCart ? `<div class="absolute -top-2 -right-2 bg-brand-500 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs font-black shadow-md border-2 border-white">${inCart.qty}</div>` : '';
                return `
                    <div onclick="addToCart('${p.name}', ${p.price})" class="bg-white border border-slate-200 rounded-2xl p-4 cursor-pointer hover:border-brand-500 hover:shadow-md transition-all btn-active-scale relative flex flex-col justify-between min-h-[100px]">
                        ${badge}
                        <div class="font-bold text-slate-700 text-sm leading-tight mb-2">${p.name}</div>
                        <div class="font-black text-brand-600">${money(p.price)}</div>
                    </div>
                `;
            }).join('');
        }

        window.selectCategory = (c) => {
            window.appState.selectedCategory = c;
            renderMenu();
        };

        window.addToCart = (name, price) => {
            const cart = window.appState.cart;
            const idx = cart.findIndex(x => x.name === name);
            if (idx > -1) cart[idx].qty += 1;
            else cart.push({ name, price, qty: 1 });
            renderCart();
            renderMenu(); // update badges
        };

        window.updateQty = (name, delta) => {
            const cart = window.appState.cart;
            const idx = cart.findIndex(x => x.name === name);
            if (idx > -1) {
                cart[idx].qty += delta;
                if (cart[idx].qty <= 0) cart.splice(idx, 1);
            }
            renderCart();
            renderMenu();
        };

        window.clearCart = () => {
            window.appState.cart = [];
            renderCart();
            renderMenu();
        };

        function renderCart() {
            const container = $("cartItems");
            const totalEl = $("cartTotal");
            if(!container) return;

            const cart = window.appState.cart;
            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-400 text-sm py-8 font-medium">Sepetiniz boş</div>`;
                totalEl.textContent = money(0);
                return;
            }

            let sum = 0;
            container.innerHTML = cart.map(i => {
                const total = i.price * i.qty;
                sum += total;
                return `
                    <div class="flex items-center justify-between bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                        <div class="flex-1 min-w-0 pr-2">
                            <div class="font-bold text-sm text-slate-800 truncate">${i.name}</div>
                            <div class="text-brand-600 font-bold text-xs">${money(total)}</div>
                        </div>
                        <div class="flex items-center gap-2 bg-white rounded-lg border border-slate-200 p-1 shrink-0">
                            <button onclick="updateQty('${i.name}', -1)" class="w-6 h-6 flex items-center justify-center bg-slate-100 rounded text-slate-600 font-bold hover:bg-slate-200">-</button>
                            <span class="font-black text-sm w-4 text-center text-slate-800">${i.qty}</span>
                            <button onclick="updateQty('${i.name}', 1)" class="w-6 h-6 flex items-center justify-center bg-slate-100 rounded text-slate-600 font-bold hover:bg-slate-200">+</button>
                        </div>
                    </div>
                `;
            }).join('');
            totalEl.textContent = money(sum);
        }

        function setupCustomerSearch() {
            const input = $("newPhone");
            const sug = $("phoneSuggestions");
            if(!input) return;

            input.addEventListener('input', (e) => {
                const val = norm(e.target.value);
                if (val.length < 3) { sug.classList.add('hidden'); return; }

                const matches = Object.values(window.appState.customers).filter(c => norm(c.phone).includes(val));
                if (matches.length === 0) { sug.classList.add('hidden'); return; }

                sug.innerHTML = matches.slice(0,4).map(c => `
                    <div onclick="selectCustomer('${c.phone}')" class="p-3 border-b border-slate-100 hover:bg-slate-50 cursor-pointer transition-colors">
                        <div class="font-bold text-sm text-slate-800">${c.name}</div>
                        <div class="text-xs font-semibold text-slate-500">${c.phone}</div>
                    </div>
                `).join('');
                sug.classList.remove('hidden');
            });
        }

        window.selectCustomer = (phone) => {
            const c = Object.values(window.appState.customers).find(x => x.phone === phone);
            if(c) {
                $("newPhone").value = c.phone;
                $("newName").value = c.name;
                $("newAddress").value = c.address;
            }
            $("phoneSuggestions").classList.add('hidden');
        };

        window.createOrder = async () => {
            const cart = window.appState.cart;
            if(!cart.length) return toast("Sepet boş!");

            const phone = $("newPhone").value.trim();
            const name = $("newName").value.trim();
            const address = $("newAddress").value.trim();

            if(!phone || !name || !address) return toast("Müşteri bilgileri eksik!");

            const total = cart.reduce((s, x) => s + (x.price * x.qty), 0);
            const now = Date.now();

            const orderData = {
                customerName: name,
                phone: phone,
                address: address,
                items: cart,
                total: total,
                payment: $("newPayment").value,
                status: "kurye_bekliyor", // kurye_bekliyor, yolda, teslim_edildi
                createdAt: now,
                note: $("newNote").value.trim()
            };

            try {
                // Save Order
                const docRef = await addDoc(getColRef('orders'), orderData);
                orderData.id = docRef.id;
                
                // Save/Update Customer
                const phoneId = norm(phone);
                await setDoc(getDocRef('customers', phoneId), { name, phone, address, lastOrderAt: now }, {merge:true});

                toast("✅ Sipariş Onaylandı");
                printReceipt(orderData, true);
                
                // Reset form
                clearCart();
                $("newPhone").value = ''; $("newName").value = ''; $("newAddress").value = ''; $("newNote").value = '';
                
            } catch(e) {
                console.error(e);
                toast("Veritabanı hatası!");
            }
        };

        // --- STREAMING_CHUNK:Order Rendering & Actions ---
        function getStatusProps(s) {
            if(s === 'kurye_bekliyor') return { col: 'bg-red-500', bg: 'bg-red-50', text: 'text-red-600', border: 'border-red-200', lbl: '⌛ Kurye Bekliyor' };
            if(s === 'yolda') return { col: 'bg-blue-500', bg: 'bg-blue-50', text: 'text-blue-600', border: 'border-blue-200', lbl: '🛵 Yolda' };
            return { col: 'bg-green-500', bg: 'bg-green-50', text: 'text-green-600', border: 'border-green-200', lbl: '✅ Teslim Edildi' };
        }

        window.changeOrderStatus = async (id, newStatus) => {
            try {
                await updateDoc(getDocRef('orders', id), { status: newStatus, updatedAt: Date.now() });
                toast("Durum güncellendi");
            } catch(e) { toast("Hata!"); }
        };

        function renderOrderCard(o, showActions = true) {
            const props = getStatusProps(o.status);
            const tpl = $("tpl-order-card").innerHTML;
            const time = new Date(o.createdAt).toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});
            const itemsHtml = o.items.map(i => `${i.qty}x ${i.name}`).join(' • ');
            const noteHtml = o.note ? `<div class="mt-1 text-xs font-bold text-brand-600">Not: ${o.note}</div>` : '';
            
            let actionBtn = '';
            if (showActions) {
                if (o.status === 'kurye_bekliyor') {
                    actionBtn = `<button onclick="changeOrderStatus('${o.id}', 'yolda')" class="col-span-2 btn-active-scale bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-sm flex justify-center items-center gap-1 transition-colors mt-1 shadow-lg shadow-blue-500/30">🛵 Yola Çıkar</button>`;
                } else if (o.status === 'yolda') {
                    actionBtn = `<button onclick="changeOrderStatus('${o.id}', 'teslim_edildi')" class="col-span-2 btn-active-scale bg-green-600 hover:bg-green-700 text-white font-black py-3 rounded-xl text-sm flex justify-center items-center gap-1 transition-colors mt-1 shadow-lg shadow-green-500/30">✓ TESLİM ET</button>`;
                }
                
                // Admin can print active orders
                if(window.appState.role === 'admin' && o.status !== 'teslim_edildi') {
                   actionBtn += `<button onclick='printFromId("${o.id}")' class="col-span-2 btn-active-scale bg-slate-800 hover:bg-slate-900 text-white font-bold py-2 rounded-xl text-xs mt-1 transition-colors">🖨️ Fiş Bas</button>`;
                }
            }

            return tpl.replace('{statusColor}', props.col)
                      .replace('{name}', o.customerName || 'İsimsiz')
                      .replace('{time}', time)
                      .replace('{total}', money(o.total))
                      .replace('{payment}', o.payment)
                      .replace('{statusBg}', props.bg).replace('{statusText}', props.text).replace('{statusBorder}', props.border).replace('{statusLabel}', props.lbl)
                      .replace('{items}', itemsHtml)
                      .replace('{noteHtml}', noteHtml)
                      .replace('{phoneRaw}', norm(o.phone))
                      .replace('{addressEnc}', encodeURIComponent(o.address))
                      .replace('{actionBtn}', actionBtn);
        }

        window.printFromId = (id) => {
            const o = window.appState.orders.find(x => x.id === id);
            if(o) printReceipt(o, true);
        }

        function renderActiveOrders() {
            const container = $("activeGrid");
            if(!container) return;
            const active = window.appState.orders.filter(o => o.status !== 'teslim_edildi');
            
            if(active.length === 0) {
                container.innerHTML = `<div class="col-span-full flex flex-col items-center justify-center py-20 text-slate-400"><div class="text-6xl mb-4 opacity-50">🍽️</div><div class="font-bold text-lg">Aktif sipariş bulunmuyor.</div></div>`;
                return;
            }
            container.innerHTML = active.map(o => renderOrderCard(o, true)).join('');
        }

        function renderSimpleList(type) {
            const container = $("listGrid");
            const searchInput = $("listSearch");
            if(!container) return;

            let data = [];
            if(type === 'history') {
                data = window.appState.orders;
            } else if (type === 'customers') {
                data = Object.values(window.appState.customers);
            }

            const render = () => {
                const q = (searchInput?.value || '').toLowerCase();
                let filtered = data;
                
                if (q) {
                    filtered = data.filter(item => {
                        const str = (item.customerName || item.name || '') + ' ' + (item.phone || '') + ' ' + (item.address || '');
                        return str.toLowerCase().includes(q);
                    });
                }

                if(filtered.length === 0) {
                    container.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400 font-bold">Kayıt bulunamadı.</div>`;
                    return;
                }

                if(type === 'history') {
                    container.innerHTML = filtered.map(o => renderOrderCard(o, false)).join('');
                } else {
                    container.innerHTML = filtered.map(c => `
                        <div class="bg-white rounded-2xl p-4 shadow-card border border-slate-200">
                            <div class="font-bold text-lg text-slate-800">${c.name}</div>
                            <div class="font-semibold text-brand-600 mb-2">${c.phone}</div>
                            <div class="text-sm text-slate-600 bg-slate-50 p-2 rounded-lg border border-slate-100">${c.address}</div>
                        </div>
                    `).join('');
                }
            };

            if(searchInput) {
                searchInput.oninput = render;
            }
            render();
        }

        // --- STREAMING_CHUNK:Printing & Utilities ---
        function printReceipt(o, autoPrint = false) {
            const printBox = $("print-area");
            const itemsHtml = (o.items || []).map(i => `
                <div class="print-row">
                    <span>${i.qty}x ${i.name}</span>
                    <span>${money(i.price * i.qty)}</span>
                </div>
            `).join("");

            printBox.innerHTML = `
                <div style="text-align:center; font-weight:bold; font-size:16px; margin-bottom:2px;">HAYAL PİDE</div>
                <div style="text-align:center; font-size:10px; margin-bottom:6px;">Paket Servis Adisyonu</div>
                <div class="print-line"></div>
                <div><b>Tarih:</b> ${new Date(o.createdAt || Date.now()).toLocaleString("tr-TR")}</div>
                <div><b>Müşteri:</b> ${o.customerName || ''}</div>
                <div><b>Tel:</b> ${o.phone || ''}</div>
                <div style="word-wrap:break-word; margin-bottom:4px;"><b>Adres:</b> ${o.address || ''}</div>
                <div class="print-line"></div>
                ${itemsHtml}
                <div class="print-line"></div>
                <div class="print-row" style="font-weight:bold; font-size:14px; margin-top:4px;">
                    <span>Ödeme (${o.payment || ''}):</span>
                    <span>${money(o.total)}</span>
                </div>
                ${o.note ? `<div style="margin-top:6px; font-size:11px;"><b>Not:</b> ${o.note}</div>` : ''}
                <div class="print-line"></div>
                <div style="text-align:center; font-weight:bold; margin-top:6px; font-size:12px;">Afiyet Olsun!</div>
            `;

            if (autoPrint) setTimeout(() => { window.print(); }, 150);
        }

        // Initialize display
        setTimeout(() => $("loginScreen").classList.remove("opacity-0"), 100);

    </script>
</body>
</html>
