<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>Hayal Pide | Paket Servis</title>
<style>
:root{--bg:#09090b;--card:#141417;--card2:#1b1b20;--gold:#f4b942;--text:#f7f7f8;--muted:#9b9ba5;--line:#29292f;--green:#27c281;--red:#ef5350;--blue:#55a7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}.hidden{display:none!important}.app{max-width:1280px;margin:auto;min-height:100vh}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 20px 60px #0008}
.brand{font-size:28px;font-weight:900}.brand b{color:var(--gold)}.sub{color:var(--muted);margin:6px 0 22px}
.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:13px;margin:0 0 7px}.field input,.field select,.field textarea,.search{width:100%;background:#0f0f12;border:1px solid var(--line);color:#fff;border-radius:14px;padding:13px;outline:none}.field input:focus,.field textarea:focus,.search:focus{border-color:var(--gold)}
.btn{border:0;border-radius:14px;padding:12px 15px;font-weight:800;cursor:pointer}.primary{background:var(--gold);color:#17120a}.dark{background:var(--card2);color:#fff;border:1px solid var(--line)}.danger{background:#3b1719;color:#ffaaa7}.green{background:#123526;color:#7aefb7}
.login .btn{width:100%;margin-top:8px}.err{color:#ff8e8a;font-size:13px;margin-top:10px}
header{position:sticky;top:0;z-index:20;background:#09090bf2;backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
header .brand{font-size:21px}.userbox{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.layout{display:grid;grid-template-columns:190px 1fr;min-height:calc(100vh - 64px)}
nav{border-right:1px solid var(--line);padding:14px;position:sticky;top:64px;height:calc(100vh - 64px)}
.navbtn{width:100%;text-align:left;margin:4px 0;background:transparent;color:var(--muted);border:0;padding:12px;border-radius:12px;font-weight:750}.navbtn.active,.navbtn:hover{background:var(--card2);color:var(--gold)}
main{padding:18px;min-width:0}.page-title{font-size:25px;font-weight:900;margin-bottom:15px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}.panel h3{margin:0 0 12px}
.customer-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.customer-grid .wide{grid-column:1/-1}
.catbar{display:flex;gap:8px;overflow:auto;padding:3px 0 12px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card2);color:var(--muted);border-radius:999px;padding:9px 12px;font-weight:750}.chip.active{background:var(--gold);color:#17120a;border-color:var(--gold)}
.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;max-height:58vh;overflow:auto}.product{background:var(--card2);border:1px solid var(--line);border-radius:15px;padding:12px;cursor:pointer;min-height:92px;display:flex;flex-direction:column;justify-content:space-between}.product:hover{border-color:#6c5528}.product-name{font-weight:800;font-size:14px}.price{color:var(--gold);font-weight:900;margin-top:8px}
.cart{position:sticky;top:82px}.cart-list{max-height:42vh;overflow:auto}.cart-row{padding:11px 0;border-bottom:1px solid var(--line)}.cart-top{display:flex;justify-content:space-between;gap:10px;font-weight:750}.qty{display:flex;gap:7px;align-items:center;margin-top:8px}.qty button{width:28px;height:28px;border:0;border-radius:8px;background:#29292f;color:#fff}.extra{font-size:11px;color:var(--muted);margin-top:3px}.total{display:flex;justify-content:space-between;font-size:23px;font-weight:950;padding:15px 0}.order-actions{display:grid;gap:8px}.empty{color:var(--muted);padding:22px 5px;text-align:center}
.orders{display:grid;gap:10px}.order{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}.order-head{display:flex;justify-content:space-between;gap:12px}.badge{font-size:11px;font-weight:900;border-radius:999px;padding:6px 9px;background:#2a2418;color:#ffd77d}.badge.yolda{background:#132d45;color:#8cc8ff}.badge.teslim_edildi{background:#143326;color:#86e6b6}.order-meta{color:var(--muted);font-size:12px;margin-top:7px}.order-items{font-size:13px;margin-top:9px;line-height:1.55}.order-buttons{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.order-buttons a{text-decoration:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:25px;margin-top:5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#25252a;border:1px solid #444;color:#fff;padding:12px 16px;border-radius:14px;z-index:99;box-shadow:0 10px 40px #0008}
@media(max-width:900px){.layout{grid-template-columns:1fr}nav{position:fixed;z-index:30;bottom:0;top:auto;left:0;right:0;height:auto;background:#101013f7;border:0;border-top:1px solid var(--line);display:flex;padding:7px}.navbtn{text-align:center;font-size:11px;padding:10px 4px}.navbtn span{display:none}main{padding:14px 12px 88px}.grid{grid-template-columns:1fr}.cart{position:static}.products{grid-template-columns:repeat(2,minmax(0,1fr));max-height:none}.stats{grid-template-columns:1fr 1fr}.customer-grid{grid-template-columns:1fr}.customer-grid .wide{grid-column:auto}}
</style>
</head>
<body>
<div id="login" class="login">
 <div class="login-card">
  <div class="brand">HAYAL <b>PİDE</b></div><div class="sub">Paket Servis Yönetim Sistemi</div>
  <div class="field"><label>E-posta</label><input id="email" type="email" autocomplete="username"></div>
  <div class="field"><label>Şifre</label><input id="password" type="password" autocomplete="current-password"></div>
  <button id="loginBtn" class="btn primary">Giriş Yap</button><div id="loginErr" class="err"></div>
 </div>
</div>

<div id="app" class="app hidden">
<header><div class="brand">HAYAL <b>PİDE</b></div><div class="userbox"><span id="roleText"></span><button id="logoutBtn" class="btn dark">Çıkış</button></div></header>
<div class="layout">
<nav id="nav">
 <button class="navbtn active" data-page="new">➕ <span>Yeni Sipariş</span></button>
 <button class="navbtn" data-page="active">🛵 <span>Aktif Siparişler</span></button>
 <button class="navbtn admin-only" data-page="customers">👥 <span>Müşteriler</span></button>
 <button class="navbtn admin-only" data-page="reports">📊 <span>Raporlar</span></button>
</nav>
<main>
<section id="page-new">
 <div class="page-title">Yeni Sipariş</div>
 <div class="grid">
  <div>
   <div class="panel" style="margin-bottom:14px">
    <h3>Müşteri</h3>
    <div class="customer-grid">
     <div class="field"><label>Telefon</label><input id="custPhone" placeholder="05xx xxx xx xx"></div>
     <div class="field"><label>Ad Soyad</label><input id="custName" placeholder="Müşteri adı"></div>
     <div class="field wide"><label>Adres</label><textarea id="custAddress" rows="2" placeholder="Mahalle, sokak, bina, daire..."></textarea></div>
    </div>
   </div>
   <div class="panel">
    <input id="productSearch" class="search" placeholder="🔎 Ürün ara...">
    <div id="categories" class="catbar"></div>
    <div id="products" class="products"></div>
   </div>
  </div>
  <div class="panel cart">
   <h3>Sepet</h3><div id="cartList" class="cart-list"></div>
   <div class="field"><label>Ödeme</label><select id="payment"><option>Nakit</option><option>Kredi/Banka Kartı</option><option>Online Ödeme</option></select></div>
   <div class="field"><label>Kurye</label><select id="courier"><option value="EkrRQkpLKXby9vDwlmap6EA6ZkD3">Kurye 1</option></select></div>
   <div class="field"><label>Sipariş Notu</label><textarea id="orderNote" rows="2"></textarea></div>
   <div class="total"><span>Toplam</span><span id="total">₺0</span></div>
   <div class="order-actions"><button id="createOrder" class="btn primary">Siparişi Oluştur</button><button id="clearCart" class="btn dark">Sepeti Temizle</button></div>
  </div>
 </div>
</section>
<section id="page-active" class="hidden"><div class="page-title">Aktif Siparişler</div><div id="activeOrders" class="orders"></div></section>
<section id="page-customers" class="hidden"><div class="page-title">Müşteriler</div><div class="panel"><input id="customerSearch" class="search" placeholder="Müşteri veya telefon ara..."><div id="customerList" class="orders" style="margin-top:12px"></div></div></section>
<section id="page-reports" class="hidden"><div class="page-title">Bugün</div><div class="stats"><div class="stat"><small>Sipariş</small><strong id="statOrders">0</strong></div><div class="stat"><small>Ciro</small><strong id="statRevenue">₺0</strong></div><div class="stat"><small>Teslim</small><strong id="statDelivered">0</strong></div></div><div class="panel"><h3>Son Teslimatlar</h3><div id="deliveredOrders" class="orders"></div></div></section>
</main></div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import {getDatabase,ref,push,set,update,onValue,get} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

const firebaseConfig={apiKey:"AIzaSyBaAUdtandBzmWyNLkdnhsfXVpNDnOlS24",authDomain:"hayal-pide-paket-servis.firebaseapp.com",databaseURL:"https://hayal-pide-paket-servis-default-rtdb.europe-west1.firebasedatabase.app",projectId:"hayal-pide-paket-servis",storageBucket:"hayal-pide-paket-servis.firebasestorage.app",messagingSenderId:"551700082149",appId:"1:551700082149:web:6d7f5aea7f8c51ff55930c",measurementId:"G-8PEXMYJN3L"};
const ADMIN="Rmf7DZGAsLRuQ00JAJOwERvPIGC3", COURIER="EkrRQkpLKXby9vDwlmap6EA6ZkD3";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
const $=id=>document.getElementById(id), money=n=>"₺"+Number(n||0).toLocaleString("tr-TR");
const catalog={
"Trabzon Yağlıları":[["Trabzon Yağlısı Kavurmalı",400],["Trabzon Yağlısı Kavurmalı Yumurtalı",420],["Trabzon Yağlısı Kavurmalı Kaşarlı",440],["Trabzon Yağlısı Kaşarlı",350],["Trabzon Yağlısı Kaşarlı Yumurtalı",370],["Trabzon Yağlısı Kuşbaşılı",400],["Trabzon Yağlısı Kuşbaşı Yumurtalı",420],["Trabzon Yağlısı Kuşbaşı Kaşarlı",440]],
"Sivas Usulü Kenarsız Pide":[["Sivas Pidesi Kıymalı",420],["Sivas Pidesi Kıymalı Yumurtalı",440],["Sivas Pidesi Kıymalı Kaşarlı",460],["Sivas Pidesi Kuşbaşılı",520],["Sivas Pidesi Kuşbaşı Yumurtalı",540],["Sivas Pidesi Kuşbaşı Kaşarlı",560]],
"Kıymalı Pideler":[["Kıymalı Sade Pide",260],["Kıymalı Yumurtalı Pide",285],["Kıymalı Kaşarlı Pide",305],["Kıymalı Kaşarlı Sucuklu Pide",325]],
"Kuşbaşılı Pideler":[["Kuşbaşılı Sade Pide",325],["Kuşbaşılı Yumurtalı Pide",345],["Kuşbaşılı Kaşarlı Pide",365],["Kuşbaşılı Kaşarlı Sucuklu Pide",385]],
"Kaşarlı Pideler":[["Kaşarlı Sade Pide",260],["Kaşarlı Yumurtalı Pide",285],["Kaşarlı Sucuklu Pide",305]],
"Kavurmalı Pideler":[["Kavurmalı Sade Pide",430],["Kavurmalı Yumurtalı Pide",450],["Kavurmalı Kaşarlı Pide",470]],
"Vejetaryen Pideler":[["Kaşarlı Pide",260],["Sebzeli Pide",285],["Kaşarlı Sebzeli Pide",305],["Mantarlı Kaşarlı Pide",285],["Karışık Vejetaryen Pide",310]],
"Karışık Pideler":[["Karışık Pide",470]],
"Kenarsız Pideler":[["Kenarsız Kıymalı Pide",305],["Kenarsız Kıymalı Yumurtalı Pide",325],["Kenarsız Kıymalı Kaşarlı Pide",345],["Kenarsız Kıymalı Kaşarlı Sucuklu Pide",365]],
"Cantık":[["Kıymalı Cantık",260],["Kıymalı Yumurtalı Cantık",280],["Kıymalı Kaşarlı Cantık",300],["Kıymalı Kaşarlı Yumurtalı Cantık",320],["Kuşbaşılı Cantık",300],["Kuşbaşılı Yumurtalı Cantık",320],["Kuşbaşılı Kaşarlı Cantık",340],["Kuşbaşılı Kaşarlı Yumurtalı Cantık",365],["Kaşarlı Cantık",260],["Kaşarlı Yumurtalı Cantık",280],["Kavurmalı Cantık",365],["Kavurmalı Yumurtalı Cantık",385],["Kavurmalı Kaşarlı Cantık",405],["Kavurmalı Kaşarlı Yumurtalı Cantık",415],["Sucuklu Cantık",260],["Sucuklu Yumurtalı Cantık",290],["Sucuklu Kaşarlı Cantık",300],["Sucuklu Kaşarlı Yumurtalı Cantık",320],["Karışık Cantık",340]],
"Lahmacunlar":[["Lahmacun",100],["Kaşarlı Lahmacun",120],["Kıymalı Kaşarlı Sucuklu Lahmacun",140],["Kıymalı Kaşarlı Pastırmalı Lahmacun",160],["Kıymalı Kaşarlı Kavurmalı Lahmacun",300],["Fındık Lahmacun",70]],
"Yan Ürünler":[["Haydari",70],["Çiğ Köfte",70],["Mayonez (1 Adet)",20],["Ketçap (1 Adet)",20],["Turşu Biber",50],["Közlenmiş Yeşil Biber",50],["Mevsim Yeşillikleri",70],["Sumaklı Soğan",50]],
"Ekonomik Menü":[["Öğrenci Menü",450],["Süper Menü",485],["On Numara Menü",1000]],
"İçecekler":[["Pepsi (33 cl)",100],["Yedigün (33 cl)",100],["Pepsi (1 lt)",120],["Yedigün (1 lt)",120],["Tombul Ayran",65],["Küçük Ayran",45],["Su (50 cl)",30],["Sade Soda",45]]
};
let cart=[],category="Tümü",allOrders={},customers={};
function toast(t){let x=document.createElement("div");x.className="toast";x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),2200)}
function renderCats(){let cats=["Tümü",...Object.keys(catalog)];$("categories").innerHTML=cats.map(c=>`<button class="chip ${c===category?"active":""}" data-cat="${c}">${c}</button>`).join("");document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{category=b.dataset.cat;renderCats();renderProducts()})}
function renderProducts(){let q=$("productSearch").value.toLocaleLowerCase("tr");let rows=[];Object.entries(catalog).forEach(([c,ps])=>{if(category!=="Tümü"&&category!==c)return;ps.forEach(p=>{if(p[0].toLocaleLowerCase("tr").includes(q))rows.push(p)})});$("products").innerHTML=rows.map((p,i)=>`<div class="product" data-name="${p[0]}" data-price="${p[1]}"><div class="product-name">${p[0]}</div><div class="price">${money(p[1])}</div></div>`).join("")||'<div class="empty">Ürün bulunamadı.</div>';document.querySelectorAll(".product").forEach(p=>p.onclick=()=>addProduct(p.dataset.name,+p.dataset.price))}
function addProduct(name,price){let x=cart.find(i=>i.name===name);x?x.qty++:cart.push({name,price,qty:1});renderCart()}
function renderCart(){if(!cart.length)$("cartList").innerHTML='<div class="empty">Sepet boş.<br>Ürünlere dokunarak ekleyin.</div>';else $("cartList").innerHTML=cart.map((x,i)=>`<div class="cart-row"><div class="cart-top"><span>${x.name}</span><span>${money(x.price*x.qty)}</span></div><div class="qty"><button data-minus="${i}">−</button><b>${x.qty}</b><button data-plus="${i}">+</button><button data-del="${i}" style="margin-left:auto">×</button></div></div>`).join("");document.querySelectorAll("[data-minus]").forEach(b=>b.onclick=()=>{let x=cart[b.dataset.minus];if(--x.qty<=0)cart.splice(b.dataset.minus,1);renderCart()});document.querySelectorAll("[data-plus]").forEach(b=>b.onclick=()=>{cart[b.dataset.plus].qty++;renderCart()});document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{cart.splice(b.dataset.del,1);renderCart()});$("total").textContent=money(cart.reduce((s,x)=>s+x.price*x.qty,0))}
$("productSearch").oninput=renderProducts;$("clearCart").onclick=()=>{cart=[];renderCart()};
$("loginBtn").onclick=async()=>{try{$("loginErr").textContent="";await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)}catch(e){$("loginErr").textContent="Giriş yapılamadı. E-posta ve şifreyi kontrol edin."}};
$("logoutBtn").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{if(!u){$("login").classList.remove("hidden");$("app").classList.add("hidden");return}$("login").classList.add("hidden");$("app").classList.remove("hidden");let admin=u.uid===ADMIN;$("roleText").textContent=admin?"Yönetici":"Kurye";document.querySelectorAll(".admin-only").forEach(x=>x.classList.toggle("hidden",!admin));if(!admin){document.querySelector('[data-page="new"]').classList.add("hidden");showPage("active")}listenOrders(u)});
document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>showPage(b.dataset.page));
function showPage(p){document.querySelectorAll("main section").forEach(x=>x.classList.add("hidden"));$("page-"+p).classList.remove("hidden");document.querySelectorAll(".navbtn").forEach(x=>x.classList.toggle("active",x.dataset.page===p))}
$("custPhone").onblur=()=>{let phone=$("custPhone").value.replace(/\D/g,"");let c=Object.values(customers).find(x=>(x.phone||"").replace(/\D/g,"")===phone);if(c){$("custName").value=c.name||"";$("custAddress").value=c.address||"";toast("Kayıtlı müşteri bulundu")}};
$("createOrder").onclick=async()=>{let u=auth.currentUser;if(!u||u.uid!==ADMIN)return;if(!cart.length)return toast("Sepete ürün ekleyin");let phone=$("custPhone").value.trim(),name=$("custName").value.trim(),address=$("custAddress").value.trim();if(!phone||!name||!address)return toast("Müşteri bilgilerini tamamlayın");let total=cart.reduce((s,x)=>s+x.price*x.qty,0),courierId=$("courier").value,key=push(ref(db,"orders")).key,now=Date.now();let order={id:key,customerName:name,phone,address,items:cart,total,payment:$("payment").value,note:$("orderNote").value.trim(),courierId,status:"kurye_bekliyor",createdAt:now};try{let updates={};updates["orders/"+key]=order;updates["courierOrders/"+courierId+"/"+key]=order;await update(ref(db),updates);let ck=phone.replace(/\D/g,"");await set(ref(db,"customers/"+ck),{name,phone,address,updatedAt:now});cart=[];renderCart();["custPhone","custName","custAddress","orderNote"].forEach(id=>$(id).value="");toast("Sipariş oluşturuldu");showPage("active")}catch(e){console.error(e);toast("Firebase izin hatası: Rules kontrol edilmeli")}};
function listenOrders(u){if(u.uid===ADMIN){onValue(ref(db,"orders"),s=>{allOrders=s.val()||{};renderOrders()});onValue(ref(db,"customers"),s=>{customers=s.val()||{};renderCustomers()})}else onValue(ref(db,"courierOrders/"+u.uid),s=>{allOrders=s.val()||{};renderOrders()})}
function statusText(s){return({kurye_bekliyor:"Kurye Bekliyor",hazirlaniyor:"Hazırlanıyor",yolda:"Yolda",teslim_edildi:"Teslim Edildi",iptal:"İptal"})[s]||s}
function renderOrders(){let arr=Object.values(allOrders).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));let active=arr.filter(o=>!["teslim_edildi","iptal"].includes(o.status));$("activeOrders").innerHTML=active.map(orderHtml).join("")||'<div class="empty">Aktif sipariş yok.</div>';let delivered=arr.filter(o=>o.status==="teslim_edildi");$("deliveredOrders").innerHTML=delivered.slice(0,20).map(orderHtml).join("")||'<div class="empty">Henüz teslimat yok.</div>';let today=new Date();today.setHours(0,0,0,0);let td=delivered.filter(o=>(o.deliveredAt||o.createdAt)>=today.getTime());$("statOrders").textContent=arr.filter(o=>(o.createdAt||0)>=today.getTime()).length;$("statDelivered").textContent=td.length;$("statRevenue").textContent=money(td.reduce((s,o)=>s+(+o.total||0),0));bindOrderButtons()}
function orderHtml(o){let items=(o.items||[]).map(x=>`${x.qty}× ${x.name}`).join("<br>");let map="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(o.address||"");let tel="tel:"+String(o.phone||"").replace(/\s/g,"");let wa="https://wa.me/90"+String(o.phone||"").replace(/\D/g,"").replace(/^0/,"");let actions=o.status==="kurye_bekliyor"?`<button class="btn green" data-road="${o.id}">Teslim Aldım / Yola Çıktım</button>`:o.status==="yolda"?`<button class="btn primary" data-deliver="${o.id}">Teslim Ettim</button>`:"";return `<div class="order"><div class="order-head"><div><b>${o.customerName||"Müşteri"}</b> · ${money(o.total)}</div><span class="badge ${o.status}">${statusText(o.status)}</span></div><div class="order-meta">${o.phone||""}<br>${o.address||""}</div><div class="order-items">${items}</div>${o.note?`<div class="order-meta">Not: ${o.note}</div>`:""}<div class="order-buttons"><a class="btn dark" href="${map}" target="_blank">📍 Harita</a><a class="btn dark" href="${tel}">📞 Ara</a><a class="btn dark" href="${wa}" target="_blank">WhatsApp</a>${actions}</div></div>`}
function bindOrderButtons(){document.querySelectorAll("[data-road]").forEach(b=>b.onclick=()=>changeStatus(b.dataset.road,"yolda"));document.querySelectorAll("[data-deliver]").forEach(b=>b.onclick=()=>changeStatus(b.dataset.deliver,"teslim_edildi"))}
async function changeStatus(id,status){let u=auth.currentUser,o=allOrders[id];if(!u||!o)return;let stamp=status==="yolda"?"pickedUpAt":"deliveredAt",now=Date.now();try{if(u.uid===ADMIN){await update(ref(db,"orders/"+id),{status,[stamp]:now});await update(ref(db,"courierOrders/"+o.courierId+"/"+id),{status,[stamp]:now})}else{await update(ref(db,"courierOrders/"+u.uid+"/"+id),{status,[stamp]:now});await update(ref(db,"orders/"+id),{status,[stamp]:now})}toast(status==="yolda"?"Sipariş yola çıktı":"Sipariş teslim edildi")}catch(e){console.error(e);toast("Durum güncellenemedi")}}
function renderCustomers(){let q=($("customerSearch")?.value||"").toLocaleLowerCase("tr");let arr=Object.values(customers).filter(c=>((c.name||"")+" "+(c.phone||"")).toLocaleLowerCase("tr").includes(q));$("customerList").innerHTML=arr.map(c=>`<div class="order"><b>${c.name||""}</b><div class="order-meta">${c.phone||""}<br>${c.address||""}</div></div>`).join("")||'<div class="empty">Müşteri bulunamadı.</div>'}
$("customerSearch").oninput=renderCustomers;
renderCats();renderProducts();renderCart();
</script>
</body>
